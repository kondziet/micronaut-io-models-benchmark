services:
  upstream-services:
    image: openresty/openresty:alpine
    container_name: benchmark_mock_server
    ports:
      - "8081:80"
    volumes:
      - ./latency-profiles.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: ["nginx", "-g", "daemon off;"]