# Configure worker connections for high load
worker_processes 1;

events {
    worker_connections 10000; # Allow many concurrent connections
}

http {
    # Include default mime types
    include       mime.types;
    default_type  application/json;
    
    # Access logs off to save disk I/O during benchmark
    access_log off;

    server {
        listen 80;

        # Endpoint 1: Premium Flights (Fast, Expensive, Direct)
        location /flights/premium {
            content_by_lua_block {
                -- 1. Simulate Latency (50ms)
                ngx.sleep(0.05)
                
                -- 2. Generate 20 Premium Flights
                local flights = {}
                for i=1,20 do
                    local price = 400 + (i * 10)
                    local id = "PREM-" .. i
                    -- Direct flight (120 mins = 2 hours)
                    table.insert(flights, string.format(
                        '{"id":"%s", "price":%d, "durationMinutes":120, "isDirect":true}', 
                        id, price
                    ))
                end
                
                -- 3. Return JSON array
                ngx.say("[" .. table.concat(flights, ",") .. "]")
            }
        }

        # Endpoint 2: Budget Flights (Slow, Cheap, Indirect)
        location /flights/budget {
            content_by_lua_block {
                -- 1. Simulate Latency (150ms)
                ngx.sleep(0.15)
                
                -- 2. Generate 50 Budget Flights
                local flights = {}
                for i=1,50 do
                    local price = 80 + (i * 5)
                    local id = "BUDG-" .. i
                    -- Longer duration (300-500 mins), Indirect
                    local duration = 300 + (i * 4)
                    table.insert(flights, string.format(
                        '{"id":"%s", "price":%d, "durationMinutes":%d, "isDirect":false}', 
                        id, price, duration
                    ))
                end
                
                ngx.say("[" .. table.concat(flights, ",") .. "]")
            }
        }

        # Endpoint 3: Hotels (Medium, Flaky)
        location /hotels {
            content_by_lua_block {
                -- 1. Simulate Latency (100ms)
                ngx.sleep(0.1)

                -- 2. Generate 50 Hotels
                local hotels = {}
                for i=1,50 do
                    local price = 50 + (i * 5)
                    local id = "HTL-" .. i
                    -- Stars cycle 1 to 5
                    local stars = (i % 5) + 1
                    table.insert(hotels, string.format(
                        '{"id":"%s", "price":%d, "stars":%d}',
                        id, price, stars
                    ))
                end

                ngx.say("[" .. table.concat(hotels, ",") .. "]")
            }
        }
    }
}